name = "omeglo-cron-cleanup"
main = "src/index.js"
compatibility_date = "2024-04-01"

# 1. Automated Cron Trigger Schedule
# Runs daily at 00:00 UTC (Midnight)
[triggers]
crons = ["0 0 * * *"]

# 2. Cloudflare D1 Database Binding
# Replace database_name and database_id with your Cloudflare D1 database details
[[d1_databases]]
binding = "DB"
database_name = "omeglo-db"
database_id = "your_d1_database_id"
