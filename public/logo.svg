<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="omeglo-grad" x1="4" y1="8" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="omeglo-lens" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Left Peer Orbit / Bubble -->
  <circle cx="18" cy="24" r="12" stroke="url(#omeglo-grad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="60 16" />
  
  <!-- Right Peer Orbit / Bubble -->
  <circle cx="30" cy="24" r="12" stroke="url(#omeglo-grad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="60 16" transform="rotate(180 30 24)" />

  <!-- Central Connecting Video Pulse / Iris -->
  <circle cx="24" cy="24" r="5.5" fill="url(#omeglo-grad)" />
  <circle cx="24" cy="24" r="2.2" fill="url(#omeglo-lens)" />
  <circle cx="26" cy="22" r="0.9" fill="#ffffff" />
</svg>
